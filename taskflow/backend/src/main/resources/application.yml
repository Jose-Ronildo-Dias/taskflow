spring:
  application:
    name: taskflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: ${SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    locale: pt-BR
    locale-resolver: fixed
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: TASKFLOW_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        path: /
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    log-links: ${MAIL_LOG_LINKS:false}
    from: ${MAIL_FROM:no-reply@taskflow.local}
  password-reset:
    token-ttl: PT1H
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
