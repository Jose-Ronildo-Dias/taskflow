name: taskflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (veja .env.example)}
    volumes:
      - taskflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-7d}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@taskflow.local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_LOG_LINKS: ${MAIL_LOG_LINKS:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [internal]

volumes:
  taskflow-db:

networks:
  internal:
